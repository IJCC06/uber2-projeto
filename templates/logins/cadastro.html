<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro | Uber 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card border-0 shadow-sm login-bootstrap-card" style="max-width: 760px;" aria-labelledby="cadastro-title">
            <div class="card-body p-4 p-md-5">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">U2</span>
                    <span>Uber 2</span>
                </div>
                <header class="login-header">
                    <h1 id="cadastro-title">Crie sua conta</h1>
                    <p>Preencha seus dados para começar a utilizar o Uber 2.</p>
                </header>
                {% if erro %}
                    <div class="alert alert-danger" role="alert">{{ erro }}</div>
                {% endif %}
                {% if sucesso %}
                    <div class="alert alert-success" role="status">{{ sucesso }}</div>
                {% endif %}
                <form class="vstack gap-3" action="{{ url_for('auth.cadastro') }}" method="POST">
                    <div>
                        <label class="form-label" for="nome">Nome completo</label>
                        <input class="form-control" id="nome" name="nome" type="text" autocomplete="name"
                               placeholder="Digite seu nome completo" maxlength="100" required>
                    </div>
                    <div>
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email"
                               placeholder="voce@exemplo.com" maxlength="150" required>
                    </div>
                    <div>
                        <label class="form-label" for="telefone">Telefone</label>
                        <input class="form-control" id="telefone" name="telefone" type="tel" autocomplete="tel"
                               placeholder="(00) 00000-0000" maxlength="20" required>
                    </div>
                    <div>
                        <label class="form-label" for="senha">Senha</label>
                        <input class="form-control" id="senha" name="senha" type="password" autocomplete="new-password"
                               placeholder="Crie uma senha" minlength="8" required>
                    </div>
                    <div>
                        <label class="form-label" for="confirmar_senha">Confirmar senha</label>
                        <input class="form-control" id="confirmar_senha" name="confirmar_senha" type="password"
                               autocomplete="new-password" placeholder="Digite sua senha novamente" minlength="8" required>
                    </div>
                    <button class="btn btn-dark" type="submit">Criar minha conta</button>
                </form>
                <p class="login-footer mt-3 mb-0 text-center">
                    Já possui uma conta?
                    <a href="{{ url_for('auth.login') }}">Faça login</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
