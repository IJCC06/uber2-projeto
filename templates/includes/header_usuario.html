<header class="topbar">
    <a class="brand" href="{{ url_for('usuarios.home') }}" aria-label="Uber 2: início">
        U2 <span>Uber 2</span>
    </a>

    <nav class="nav nav-pills flex-wrap" aria-label="Navegação principal">
        <a class="nav-link{% if request.endpoint == 'usuarios.home' %} active{% endif %}"
           href="{{ url_for('usuarios.home') }}"
           {% if request.endpoint == 'usuarios.home' %}aria-current="page"{% endif %}>
            Início
        </a>
        <a class="nav-link{% if request.endpoint == 'usuarios.solicitar_corrida' %} active{% endif %}"
           href="{{ url_for('usuarios.solicitar_corrida') }}"
           {% if request.endpoint == 'usuarios.solicitar_corrida' %}aria-current="page"{% endif %}>
            Solicitar corrida
        </a>
        <a class="nav-link{% if request.endpoint == 'usuarios.minhas_corridas' %} active{% endif %}"
           href="{{ url_for('usuarios.minhas_corridas') }}"
           {% if request.endpoint == 'usuarios.minhas_corridas' %}aria-current="page"{% endif %}>
            Minhas corridas
        </a>
        <a class="nav-link{% if request.endpoint == 'usuarios.pagamentos' %} active{% endif %}"
           href="{{ url_for('usuarios.pagamentos') }}"
           {% if request.endpoint == 'usuarios.pagamentos' %}aria-current="page"{% endif %}>
            Pagamentos
        </a>
        <a class="nav-link{% if request.endpoint == 'usuarios.conta' %} active{% endif %}"
           href="{{ url_for('usuarios.conta') }}"
           {% if request.endpoint == 'usuarios.conta' %}aria-current="page"{% endif %}>
            Minha conta
        </a>
    </nav>

    <form class="d-flex" action="{{ url_for('auth.logout') }}" method="POST">
        <button class="btn btn-outline-dark btn-sm" type="submit">Sair</button>
    </form>
</header>
