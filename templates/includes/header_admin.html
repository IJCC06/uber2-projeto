<header class="topbar">
    <a class="brand" href="{{ url_for('admins.home') }}" aria-label="Uber 2: início">
        U2 <span>Uber 2</span>
    </a>

    <nav class="nav nav-pills flex-wrap" aria-label="Navegação principal">
        <a class="nav-link{% if request.endpoint == 'admins.home' %} active{% endif %}"
           href="{{ url_for('admins.home') }}"
           {% if request.endpoint == 'admins.home' %}aria-current="page"{% endif %}>
            Painel administrativo
        </a>
        <a class="nav-link{% if request.endpoint in ('admins.usuarios', 'admins.atualizar_status_usuario') %} active{% endif %}"
           href="{{ url_for('admins.usuarios') }}"
           {% if request.endpoint in ('admins.usuarios', 'admins.atualizar_status_usuario') %}aria-current="page"{% endif %}>
            Usuários
        </a>
        <a class="nav-link{% if request.endpoint in ('admins.motoristas', 'admins.atualizar_status_motorista') %} active{% endif %}"
           href="{{ url_for('admins.motoristas') }}"
           {% if request.endpoint in ('admins.motoristas', 'admins.atualizar_status_motorista') %}aria-current="page"{% endif %}>
            Motoristas
        </a>
        <a class="nav-link{% if request.endpoint == 'admins.corridas' %} active{% endif %}"
           href="{{ url_for('admins.corridas') }}"
           {% if request.endpoint == 'admins.corridas' %}aria-current="page"{% endif %}>
            Corridas
        </a>
        <a class="nav-link{% if request.endpoint == 'admins.pagamentos' %} active{% endif %}"
           href="{{ url_for('admins.pagamentos') }}"
           {% if request.endpoint == 'admins.pagamentos' %}aria-current="page"{% endif %}>
            Pagamentos
        </a>
        <a class="nav-link{% if request.endpoint == 'admins.avaliacoes' %} active{% endif %}"
           href="{{ url_for('admins.avaliacoes') }}"
           {% if request.endpoint == 'admins.avaliacoes' %}aria-current="page"{% endif %}>
            Avaliações
        </a>
        <a class="nav-link{% if request.endpoint == 'admins.conta' %} active{% endif %}"
           href="{{ url_for('admins.conta') }}"
           {% if request.endpoint == 'admins.conta' %}aria-current="page"{% endif %}>
            Minha conta
        </a>
    </nav>

    <form class="d-flex" action="{{ url_for('auth.logout') }}" method="POST">
        <button class="btn btn-outline-dark btn-sm" type="submit">Sair</button>
    </form>
</header>
